name: recall_past_investigations
description: Search investigation memory for past incidents similar to the current error — same error type, files, or patterns.
input_schema:
  properties:
    error_text:
      type: string
      description: The full stack trace or error message
    stack_files:
      type: array
      items:
        type: string
      description: File paths extracted from the stack trace
    repo_name:
      type: string
      description: Name of the GitHub repo being investigated
  required: [error_text]
implementation:
  script: scripts/recall_past_investigations.sh
  runtime: sh
