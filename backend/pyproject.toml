[project]
name = "tracefix-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "PyGithub==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
